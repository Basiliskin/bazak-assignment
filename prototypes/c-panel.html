<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>C · Panel — Shopping Copilot prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="shared/base.css" />
  <style>
    /* Variant C: results panel is a column on lg+, a bottom sheet below lg. */
    @media (max-width: 1023px) {
      #results-panel { position: fixed; inset: auto 0 0 0; z-index: 46; height: 82dvh; border-radius: 1.5rem 1.5rem 0 0;
        transform: translateY(105%); transition: transform .3s cubic-bezier(.2,.8,.2,1); box-shadow: 0 -10px 40px rgb(0 0 0 / .15); }
      body.panel-open #results-panel { transform: none; }
      body.panel-open #panel-backdrop { display: block; }
    }
    #panel-backdrop { display: none; }
  </style>
</head>
<!-- Variant C: conversations | chat (chips per Product Group) | results panel with the selected reply's groups. -->
<body class="bg-zinc-100 text-zinc-900">
  <div class="flex h-dvh">
    <aside id="sidebar" class="flex w-64 shrink-0 flex-col border-r border-zinc-200 bg-white">
      <div class="flex h-14 items-center justify-between px-4">
        <span class="flex items-center gap-2 font-semibold tracking-tight">
          <span class="flex h-7 w-7 items-center justify-center rounded-lg bg-zinc-900 text-xs text-white">✦</span>Copilot
        </span>
        <button data-action="new-chat" class="rounded-lg border border-zinc-200 px-2.5 py-1 text-xs font-medium hover:border-indigo-300 hover:text-indigo-700">＋ New</button>
      </div>
      <nav id="conversation-list" class="flex-1 space-y-0.5 overflow-y-auto px-2 pb-4" aria-label="Conversations"></nav>
    </aside>
    <div id="sidebar-backdrop" data-action="toggle-sidebar" class="fixed inset-0 z-40 bg-zinc-950/30 lg:hidden"></div>

    <main class="flex min-w-0 flex-1 flex-col bg-white lg:max-w-md xl:max-w-xl">
      <header class="flex h-14 shrink-0 items-center gap-2 border-b border-zinc-200 px-3 pr-36 lg:pr-4">
        <button data-action="toggle-sidebar" class="rounded-lg p-2 text-zinc-600 hover:bg-zinc-100 lg:hidden" aria-label="Open conversations">☰</button>
        <h1 id="chat-title" class="truncate text-sm font-medium"></h1>
      </header>
      <div id="scroll" class="flex-1 overflow-y-auto">
        <div id="messages" class="flex min-h-full flex-col gap-6 px-4 py-6"></div>
      </div>
      <div class="shrink-0 border-t border-zinc-100 px-3 pb-[max(0.75rem,env(safe-area-inset-bottom))] pt-3">
        <div id="composer-root"></div>
      </div>
    </main>

    <div id="panel-backdrop" data-action="close-panel" class="fixed inset-0 z-40 bg-zinc-950/30 lg:hidden"></div>
    <aside id="results-panel" class="flex min-w-0 flex-1 flex-col bg-zinc-50 lg:border-l lg:border-zinc-200" aria-label="Product results">
      <div class="flex h-14 shrink-0 items-center justify-between px-5 lg:pr-36">
        <h2 class="text-sm font-semibold">Results</h2>
        <button data-action="close-panel" class="rounded-lg p-2 text-zinc-500 hover:bg-zinc-200 lg:hidden" aria-label="Close results">✕</button>
      </div>
      <div id="results-panel-body" class="flex-1 overflow-y-auto px-5 pb-6"></div>
    </aside>
  </div>

  <script src="shared/catalog-data.js"></script>
  <script src="shared/scenarios.js"></script>
  <script src="shared/model.js"></script>
  <script src="shared/components.js"></script>
  <script src="shared/runtime.js"></script>
  <script>Proto.boot({ variant: 'C', groupLayout: 'chips', panel: true });</script>
</body>
</html>
